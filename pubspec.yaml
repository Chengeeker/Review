name: review
description: "A modern, lightweight Weibo third-party client built with Flutter and Material You (MD3)."
publish_to: 'none'
version: 1.6.0+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dynamic_color: ^1.7.0
  extended_image: ^8.2.1
  easy_refresh: ^3.4.0
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
